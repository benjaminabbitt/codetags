[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "BSD-3-Clause"
repository = "https://github.com/benjaminabbitt/codetags"
publish = false

[workspace.dependencies]
# Internal crates.
codetags-model = { path = "crates/codetags-model" }
codetags-names = { path = "crates/codetags-names" }
codetags-ingest = { path = "crates/codetags-ingest" }
codetags-tags = { path = "crates/codetags-tags" }
codetags-views = { path = "crates/codetags-views" }
codetags-plugins = { path = "crates/codetags-plugins" }
codetags-materialize = { path = "crates/codetags-materialize" }
codetags-mount-fuse = { path = "crates/codetags-mount-fuse" }
codetags-mount-nfs = { path = "crates/codetags-mount-nfs" }
codetags-mount-winfsp = { path = "crates/codetags-mount-winfsp" }
codetags-watch = { path = "crates/codetags-watch" }
codetags-ipc = { path = "crates/codetags-ipc" }
codetags-bdd = { path = "crates/codetags-bdd" }

# External crates. Pins and rationale: PLAN.md §4.
# tagma is pinned by full SHA; `just dev-tagma PATH` overrides it locally.
tagma-core = { git = "https://github.com/benjaminabbitt/tagma", rev = "b1ae80880a26ef4fbb620280825abe593a925861" }
# No `bundled` here (R1): development and CI link the prebuilt libduckdb that
# libduckdb-sys downloads when DUCKDB_DOWNLOAD_LIB=1 (.cargo/config.toml, V29).
# Release builds enable codetags-model's `bundled-duckdb` for a static build.
duckdb = "~1.10506"
cucumber = "0.23"
futures = "0.3"
regex = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
fuser = "0.18"
proptest = "1"
# macOS NFS loopback backend (P0b S2, V42): chosen over nfsserve.
nfs3_server = "0.11"
nfs3_client = "0.9"
tokio = { version = "1", default-features = false }
getrandom = "0.3"
# SCIP bindings, pinned exactly (brief §4.4: compare edge counts on every
# upgrade). protobuf is the version scip itself pins (V63).
scip = "=0.10.0"
protobuf = "=3.7.2"
notify = "8.2"
# GPL-3.0, allowed only beneath codetags-mount-winfsp (D9, deny.toml). The
# default features (`full`: notify, delayload, async-io) are kept; no
# `system`, so building needs no WinFsp install (V28).
winfsp = "0.13"
winfsp-sys = "0.12"
# The version winfsp 0.13 uses, for registry and DLL loading in the backend.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Storage_FileSystem"] }
# gocallgraph's JSON lines (P1.5) and Jelly's JSON call graph (P1.6).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
