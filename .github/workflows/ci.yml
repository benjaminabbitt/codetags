name: CI

on:
  push:
    # spike/** and agent/** let agents iterate on CI from their own branches
    # (P0b spikes S2-S4 need macOS and Windows runners).
    branches: [main, 'spike/**', 'agent/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # PLAN.md §5: `just check` must exit 0 on Linux, macOS, and Windows.
  # The Windows leg has no WinFsp installed, on purpose (D3).
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # DuckDB is not compiled here: .cargo/config.toml sets DUCKDB_DOWNLOAD_LIB,
      # so libduckdb-sys links the prebuilt library (PLAN.md §4, R1; V29). With
      # no C++ build there is no MAX_PATH problem on Windows, so the default
      # target directory is used on every OS.
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # rust-cache prunes files it does not recognise under target/ before
      # saving, including the downloaded libduckdb and its copy in deps/, but
      # keeps libduckdb-sys's build-script fingerprint. On a warm cache the
      # build script would not run again, and linking fails with "unable to
      # find library -lduckdb" (V29). Cleaning the package makes it download
      # the library again (a few seconds).
      - name: Re-fetch the prebuilt libduckdb
        shell: bash
        run: cargo clean -p libduckdb-sys

      - uses: extractions/setup-just@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Assert unprivileged
        shell: bash
        run: ci/assert-unprivileged.sh

      # The BDD runner records each scenario it runs in CODETAGS_BDD_RAN, for
      # the bdd-coverage job (PLAN.md §0.11).
      - name: just check
        shell: bash
        env:
          CODETAGS_BDD_RAN: ${{ runner.temp }}/bdd-ran.txt
        run: just check

      - name: Upload the BDD record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bdd-ran-check-${{ matrix.os }}
          path: ${{ runner.temp }}/bdd-ran.txt
          if-no-files-found: warn

  # PLAN.md §5: live FUSE mounts as the runner user, with no sudo (P0b S1).
  mount-linux:
    name: mount (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # rust-cache prunes files it does not recognise under target/ before
      # saving, including the downloaded libduckdb and its copy in deps/, but
      # keeps libduckdb-sys's build-script fingerprint. On a warm cache the
      # build script would not run again, and linking fails with "unable to
      # find library -lduckdb" (V29). Cleaning the package makes it download
      # the library again (a few seconds).
      - name: Re-fetch the prebuilt libduckdb
        shell: bash
        run: cargo clean -p libduckdb-sys

      - uses: extractions/setup-just@v2

      # Runner setup, not product code, so sudo is allowed here. Images from
      # 2026-07-26 on ship a non-setuid /usr/local/bin/fusermount3 that
      # shadows the setuid /usr/bin/fusermount3, and mounts fail with EPERM
      # (V12). Delete it only if it exists and is not setuid.
      - name: Remove the non-setuid fusermount3 shadow
        shell: bash
        run: |
          shadow=/usr/local/bin/fusermount3
          if [ -e "$shadow" ] && [ ! -u "$shadow" ]; then
            ls -l "$shadow"
            sudo rm -f "$shadow"
            echo "removed $shadow"
          else
            echo "no non-setuid $shadow"
          fi

      - name: Install fuse3
        shell: bash
        run: |
          if dpkg-query -W -f='${Status}' fuse3 2>/dev/null | grep -q 'install ok installed'; then
            echo "fuse3 already installed"
          else
            sudo apt-get update
            sudo apt-get install -y fuse3
          fi
          ls -l /dev/fuse "$(command -v fusermount3)"

      - name: Assert unprivileged
        shell: bash
        run: ci/assert-unprivileged.sh

      # Diagnostic: fails if the fusermount3 that mounts would use is not
      # setuid root (R6).
      - name: just doctor
        shell: bash
        run: just doctor

      - name: just test-mount
        shell: bash
        env:
          CODETAGS_BDD_RAN: ${{ runner.temp }}/bdd-ran.txt
        run: just test-mount

      - name: Upload the BDD record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bdd-ran-mount-linux
          path: ${{ runner.temp }}/bdd-ran.txt
          if-no-files-found: warn

  # PLAN.md §0.11: every scenario must run in some job, or be listed in
  # ci/expected-skips.txt. Runs whether the BDD jobs pass or fail, so a
  # failing run still reports what went unrun. Add every job that runs BDD
  # to `needs`.
  bdd-coverage:
    name: bdd-coverage
    needs: [check, mount-linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bdd-ran-*
          path: bdd-ran

      - name: Every scenario ran in some job
        shell: bash
        run: python3 ci/bdd-coverage.py bdd-ran
