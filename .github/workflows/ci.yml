name: CI

on:
  push:
    # spike/** and agent/** let agents iterate on CI from their own branches
    # (P0b spikes S2-S4 need macOS and Windows runners).
    branches: [main, 'spike/**', 'agent/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # PLAN.md §5: `just check` must exit 0 on Linux, macOS, and Windows.
  # The Windows leg has no WinFsp installed, on purpose (D3).
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # DuckDB is not compiled here: .cargo/config.toml sets DUCKDB_DOWNLOAD_LIB,
      # so libduckdb-sys links the prebuilt library (PLAN.md §4, R1; V29). With
      # no C++ build there is no MAX_PATH problem on Windows, so the default
      # target directory is used on every OS.
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # rust-cache prunes files it does not recognise under target/ before
      # saving, including the downloaded libduckdb and its copy in deps/, but
      # keeps libduckdb-sys's build-script fingerprint. On a warm cache the
      # build script would not run again, and linking fails with "unable to
      # find library -lduckdb" (V29). Cleaning the package makes it download
      # the library again (a few seconds).
      - name: Re-fetch the prebuilt libduckdb
        shell: bash
        run: cargo clean -p libduckdb-sys

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # The pinned lspmux for the @lspmux scenarios (M3; PLAN.md D19), built
      # once per OS and revision: with the cache restored, `just
      # setup-lspmux` neither builds nor fetches.
      - name: lspmux revision from providers.toml
        id: lspmux
        shell: bash
        run: echo "rev=$(sed -n '/^\[lspmux\]/,/^\[/s/^rev *= *"\(.*\)".*/\1/p' providers.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            .codetags/local/bin
            .codetags/local/.crates.toml
            .codetags/local/.crates2.json
          key: lspmux-${{ runner.os }}-${{ runner.arch }}-${{ steps.lspmux.outputs.rev }}

      - name: just setup-lspmux
        shell: bash
        run: just setup-lspmux

      - name: Assert unprivileged
        if: runner.os != 'Windows'
        shell: bash
        run: ci/assert-unprivileged.sh

      # Hosted Windows runners are elevated; ci/run-deelevated.ps1 runs a
      # command with the Administrators group made deny-only (V18).
      - name: Assert unprivileged (de-elevated)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ci/run-deelevated.ps1 "$env:ProgramFiles\Git\bin\bash.exe" ci/assert-unprivileged.sh

      # The BDD runner records each scenario it runs in CODETAGS_BDD_RAN, for
      # the bdd-coverage job (PLAN.md §0.11). The `lspmux` capability runs
      # the LSP shim's scenarios against the lspmux installed above.
      - name: just check
        if: runner.os != 'Windows'
        shell: bash
        env:
          CODETAGS_BDD_RAN: ${{ runner.temp }}/bdd-ran.txt
          CODETAGS_BDD_CAPABILITIES: lspmux
        run: just check

      # No WinFsp here (D3): the binary, built with the WinFsp backend, must
      # start, and doctor must report the fallback.
      - name: just check (de-elevated)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODETAGS_BDD_RAN: ${{ runner.temp }}/bdd-ran.txt
          CODETAGS_BDD_CAPABILITIES: lspmux
        run: ci/run-deelevated.ps1 just check

      # The fallback with WinFsp really absent; the BDD scenario forces it
      # with CODETAGS_WINFSP=off so that it holds in the WinFsp job too.
      - name: just doctor (de-elevated)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ci/run-deelevated.ps1 just doctor

      - name: Upload the BDD record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bdd-ran-check-${{ matrix.os }}
          path: ${{ runner.temp }}/bdd-ran.txt
          if-no-files-found: warn

  # PLAN.md §5: live FUSE mounts as the runner user, with no sudo (P0b S1).
  mount-linux:
    name: mount (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # rust-cache prunes files it does not recognise under target/ before
      # saving, including the downloaded libduckdb and its copy in deps/, but
      # keeps libduckdb-sys's build-script fingerprint. On a warm cache the
      # build script would not run again, and linking fails with "unable to
      # find library -lduckdb" (V29). Cleaning the package makes it download
      # the library again (a few seconds).
      - name: Re-fetch the prebuilt libduckdb
        shell: bash
        run: cargo clean -p libduckdb-sys

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      # Runner setup, not product code, so sudo is allowed here. Images from
      # 2026-07-26 on ship a non-setuid /usr/local/bin/fusermount3 that
      # shadows the setuid /usr/bin/fusermount3, and mounts fail with EPERM
      # (V12). Delete it only if it exists and is not setuid.
      - name: Remove the non-setuid fusermount3 shadow
        shell: bash
        run: |
          shadow=/usr/local/bin/fusermount3
          if [ -e "$shadow" ] && [ ! -u "$shadow" ]; then
            ls -l "$shadow"
            sudo rm -f "$shadow"
            echo "removed $shadow"
          else
            echo "no non-setuid $shadow"
          fi

      - name: Install fuse3
        shell: bash
        run: |
          if dpkg-query -W -f='${Status}' fuse3 2>/dev/null | grep -q 'install ok installed'; then
            echo "fuse3 already installed"
          else
            sudo apt-get update
            sudo apt-get install -y fuse3
          fi
          ls -l /dev/fuse "$(command -v fusermount3)"

      - name: Assert unprivileged
        shell: bash
        run: ci/assert-unprivileged.sh

      # Diagnostic: fails if the fusermount3 that mounts would use is not
      # setuid root (R6).
      - name: just doctor
        shell: bash
        run: just doctor

      - name: just test-mount
        shell: bash
        env:
          CODETAGS_BDD_RAN: ${{ runner.temp }}/bdd-ran.txt
        run: just test-mount

      - name: Upload the BDD record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bdd-ran-mount-linux
          path: ${{ runner.temp }}/bdd-ran.txt
          if-no-files-found: warn

  # PLAN.md §5: live NFS loopback mounts as the runner user, with no sudo
  # (P0b S2). macOS's built-in mount_nfs needs no setup.
  mount-macos:
    name: mount (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # As in the check job: rust-cache prunes the downloaded libduckdb but
      # keeps libduckdb-sys's build-script fingerprint (V29).
      - name: Re-fetch the prebuilt libduckdb
        shell: bash
        run: cargo clean -p libduckdb-sys

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      - name: Assert unprivileged
        shell: bash
        run: ci/assert-unprivileged.sh

      - name: just doctor
        shell: bash
        run: just doctor

      - name: just test-mount
        shell: bash
        env:
          CODETAGS_BDD_RAN: ${{ runner.temp }}/bdd-ran.txt
        run: just test-mount

      # Diagnostic: a mount left behind by a failed scenario.
      - name: NFS mounts after the tests
        if: ${{ always() }}
        shell: bash
        run: mount -t nfs || true

      - name: Upload the BDD record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bdd-ran-mount-macos
          path: ${{ runner.temp }}/bdd-ran.txt
          if-no-files-found: warn

  # PLAN.md §5: the pinned SCIP providers against tests/fixtures (P1.4 on),
  # and their edge counts against tests/baselines (P1.8).
  providers:
    name: providers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # rust-cache prunes files it does not recognise under target/ before
      # saving, including the downloaded libduckdb and its copy in deps/, but
      # keeps libduckdb-sys's build-script fingerprint. On a warm cache the
      # build script would not run again, and linking fails with "unable to
      # find library -lduckdb" (V29). Cleaning the package makes it download
      # the library again (a few seconds).
      - name: Re-fetch the prebuilt libduckdb
        shell: bash
        run: cargo clean -p libduckdb-sys

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      # The Go toolchain for scip-go and tools/gocallgraph (P1.5), at the
      # version providers.toml pins. setup-go puts `go env GOPATH`/bin, where
      # `just setup-providers` installs both, on PATH.
      - name: Go version from providers.toml
        id: go
        shell: bash
        run: echo "version=$(sed -n '/^\[go\]/,/^\[/s/^version *= *"\(.*\)".*/\1/p' providers.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: tools/gocallgraph/go.sum

      # Node for the npm providers (scip-typescript, Jelly, scip-python), at the exact
      # version providers.toml pins. setup-node's npm prefix is per-user, so
      # `npm install -g` in setup-providers needs no privilege.
      - name: Node version from providers.toml
        id: node
        shell: bash
        run: echo "version=$(sed -n '/^\[node\]/,/^\[/s/^version *= *"\(.*\)".*/\1/p' providers.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      # The Python interpreter and pip that scip-python needs (P1.7), at the
      # version providers.toml pins.
      - name: Python version from providers.toml
        id: python
        shell: bash
        run: echo "version=$(sed -n '/^\[python\]/,/^\[/s/^version *= *"\(.*\)".*/\1/p' providers.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: just setup-providers
        shell: bash
        run: just setup-providers

      # The pinned lspmux, as in the check job, for the LSP wiring scenarios
      # (features/lsp/wiring.feature, `@lspmux @providers`): they need it and
      # this toolchain's rust-analyzer, which setup-providers installs.
      - name: lspmux revision from providers.toml
        id: lspmux
        shell: bash
        run: echo "rev=$(sed -n '/^\[lspmux\]/,/^\[/s/^rev *= *"\(.*\)".*/\1/p' providers.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            .codetags/local/bin
            .codetags/local/.crates.toml
            .codetags/local/.crates2.json
          key: lspmux-${{ runner.os }}-${{ runner.arch }}-${{ steps.lspmux.outputs.rev }}

      - name: just setup-lspmux
        shell: bash
        run: just setup-lspmux

      # Providers execute project code (build scripts, proc macros), so they
      # never run as root or admin (PLAN.md §0.10).
      - name: Assert unprivileged
        if: runner.os != 'Windows'
        shell: bash
        run: ci/assert-unprivileged.sh

      # Hosted Windows runners are elevated; see the check job (V18).
      - name: Assert unprivileged (de-elevated)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ci/run-deelevated.ps1 "$env:ProgramFiles\Git\bin\bash.exe" ci/assert-unprivileged.sh

      # test-providers adds `providers` to the capabilities listed here.
      - name: just test-providers
        if: runner.os != 'Windows'
        shell: bash
        env:
          CODETAGS_BDD_RAN: ${{ runner.temp }}/bdd-ran.txt
          CODETAGS_BDD_CAPABILITIES: lspmux
        run: just test-providers

      - name: just test-providers (de-elevated)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODETAGS_BDD_RAN: ${{ runner.temp }}/bdd-ran.txt
          CODETAGS_BDD_CAPABILITIES: lspmux
        run: ci/run-deelevated.ps1 just test-providers

      # Per-file edge counts of each ingested fixture against tests/baselines
      # (P1.8): a provider that silently reads less fails here.
      - name: just baseline-check
        if: runner.os != 'Windows'
        shell: bash
        run: just baseline-check

      - name: just baseline-check (de-elevated)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ci/run-deelevated.ps1 just baseline-check

      # Dogfooding (D10, M1): index this repo. Fails on any provider failure
      # or canonical-name collision (P1.3c).
      - name: just dogfood
        if: runner.os == 'Linux'
        shell: bash
        run: just dogfood

      - name: Upload the BDD record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bdd-ran-providers-${{ matrix.os }}
          path: ${{ runner.temp }}/bdd-ran.txt
          if-no-files-found: warn

  # PLAN.md §5: live WinFsp mounts from a de-elevated process (P0b S3), and
  # S4's name probe. WinFsp is installed elevated, as an admin would once (D3).
  mount-windows:
    name: mount (windows-2025, winfsp)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # rust-cache prunes files it does not recognise under target/ before
      # saving, including the downloaded libduckdb and its copy in deps/, but
      # keeps libduckdb-sys's build-script fingerprint. On a warm cache the
      # build script would not run again, and linking fails with "unable to
      # find library -lduckdb" (V29). Cleaning the package makes it download
      # the library again (a few seconds).
      - name: Re-fetch the prebuilt libduckdb
        shell: bash
        run: cargo clean -p libduckdb-sys

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      # Runner setup, not product code, so elevation is fine here.
      - name: Install WinFsp
        shell: pwsh
        run: |
          choco install winfsp -y --no-progress
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\WinFsp' | Select-Object InstallDir

      # S4's name probe runs rg from Git Bash against the mount.
      - name: Install ripgrep
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { choco install ripgrep -y --no-progress }
          rg --version

      - name: Assert unprivileged (de-elevated)
        shell: pwsh
        run: ci/run-deelevated.ps1 "$env:ProgramFiles\Git\bin\bash.exe" ci/assert-unprivileged.sh

      - name: just doctor (de-elevated)
        shell: pwsh
        run: ci/run-deelevated.ps1 just doctor

      - name: just test-mount (de-elevated)
        shell: pwsh
        env:
          CODETAGS_BDD_RAN: ${{ runner.temp }}/bdd-ran.txt
          CODETAGS_NAME_PROBE_OUT: ${{ runner.temp }}/name-probe.md
        run: ci/run-deelevated.ps1 just test-mount

      - name: Upload the BDD record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bdd-ran-mount-windows
          path: ${{ runner.temp }}/bdd-ran.txt
          if-no-files-found: warn

      # S4's findings (docs/verification.md).
      - name: Upload the name probe table
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: name-probe-windows
          path: ${{ runner.temp }}/name-probe.md
          if-no-files-found: warn

  # PLAN.md §5: the optional privileged helper (P4.4). The scenarios start
  # codetags-privhelper with `sudo -n` themselves (the runner's sudo needs no
  # password), while the test process, its watchers and helper clients run as
  # the unprivileged runner user.
  privileged-linux:
    name: privileged (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # As in the check job: rust-cache prunes the downloaded libduckdb but
      # keeps libduckdb-sys's build-script fingerprint (V29).
      - name: Re-fetch the prebuilt libduckdb
        shell: bash
        run: cargo clean -p libduckdb-sys

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      - name: Kernel and sudo
        shell: bash
        run: |
          uname -r
          sudo -n true
          echo "sudo -n works"

      # The test process is unprivileged; only the helper runs as root.
      - name: Assert unprivileged
        shell: bash
        run: ci/assert-unprivileged.sh

      - name: just test-privileged
        shell: bash
        env:
          CODETAGS_BDD_RAN: ${{ runner.temp }}/bdd-ran.txt
        run: just test-privileged

      - name: Upload the BDD record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bdd-ran-privileged-linux
          path: ${{ runner.temp }}/bdd-ran.txt
          if-no-files-found: warn

  # M3 stage 0 (D16-D18): Claude Code's LSP client, observed live
  # (features/lsp/claude-client.feature). Runs only when the repository has
  # the ANTHROPIC_API_KEY secret (forks' pull requests never do); otherwise
  # every step is skipped, and ci/expected-skips.txt lists the scenarios.
  # Claude Code is installed unpinned, on purpose: the job's point is to fail
  # when a new version's client behaves differently.
  claude-client:
    name: claude-client (ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skipped without the ANTHROPIC_API_KEY secret
        if: env.HAS_ANTHROPIC_API_KEY != 'true'
        shell: bash
        run: |
          echo "::notice::claude-client skipped: the repository has no ANTHROPIC_API_KEY secret"

      - uses: actions/checkout@v4
        if: env.HAS_ANTHROPIC_API_KEY == 'true'

      - name: Rust toolchain from rust-toolchain.toml, with rust-analyzer
        if: env.HAS_ANTHROPIC_API_KEY == 'true'
        shell: bash
        run: |
          rustup toolchain install
          rustup component add rust-analyzer

      - uses: Swatinem/rust-cache@v2
        if: env.HAS_ANTHROPIC_API_KEY == 'true'

      # As in the check job: rust-cache prunes the downloaded libduckdb but
      # keeps libduckdb-sys's build-script fingerprint (V29).
      - name: Re-fetch the prebuilt libduckdb
        if: env.HAS_ANTHROPIC_API_KEY == 'true'
        shell: bash
        run: cargo clean -p libduckdb-sys

      - uses: taiki-e/install-action@v2
        if: env.HAS_ANTHROPIC_API_KEY == 'true'
        with:
          tool: just@1.58.0

      - uses: actions/setup-node@v4
        if: env.HAS_ANTHROPIC_API_KEY == 'true'
        with:
          node-version: 22

      - name: Install Claude Code
        if: env.HAS_ANTHROPIC_API_KEY == 'true'
        shell: bash
        run: |
          npm install -g --no-fund --no-audit @anthropic-ai/claude-code
          claude --version

      # The shim rule runs rust-analyzer through lspmux (M3).
      - name: lspmux revision from providers.toml
        if: env.HAS_ANTHROPIC_API_KEY == 'true'
        id: lspmux
        shell: bash
        run: echo "rev=$(sed -n '/^\[lspmux\]/,/^\[/s/^rev *= *"\(.*\)".*/\1/p' providers.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: env.HAS_ANTHROPIC_API_KEY == 'true'
        with:
          path: |
            .codetags/local/bin
            .codetags/local/.crates.toml
            .codetags/local/.crates2.json
          key: lspmux-${{ runner.os }}-${{ runner.arch }}-${{ steps.lspmux.outputs.rev }}

      - name: just setup-lspmux
        if: env.HAS_ANTHROPIC_API_KEY == 'true'
        shell: bash
        run: just setup-lspmux

      - name: Assert unprivileged
        if: env.HAS_ANTHROPIC_API_KEY == 'true'
        shell: bash
        run: ci/assert-unprivileged.sh

      # Only this step sees the key.
      - name: just test-claude
        if: env.HAS_ANTHROPIC_API_KEY == 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODETAGS_BDD_RAN: ${{ runner.temp }}/bdd-ran.txt
          CODETAGS_BDD_CLAUDE_SAVE: ${{ runner.temp }}/claude-recordings
        run: just test-claude

      # The sanitized recordings, to refresh tests/fixtures/lsp when a new
      # Claude Code version behaves differently.
      - name: Upload the recordings
        if: ${{ !cancelled() && env.HAS_ANTHROPIC_API_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-recordings
          path: ${{ runner.temp }}/claude-recordings
          if-no-files-found: warn

      - name: Upload the BDD record
        if: ${{ !cancelled() && env.HAS_ANTHROPIC_API_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: bdd-ran-claude-client
          path: ${{ runner.temp }}/bdd-ran.txt
          if-no-files-found: warn

  # PLAN.md §0.11: every scenario must run in some job, or be listed in
  # ci/expected-skips.txt. Runs whether the BDD jobs pass or fail, so a
  # failing run still reports what went unrun. Add every job that runs BDD
  # to `needs`.
  bdd-coverage:
    name: bdd-coverage
    needs: [check, mount-linux, mount-macos, providers, mount-windows, privileged-linux, claude-client]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bdd-ran-*
          path: bdd-ran

      - name: Every scenario ran in some job
        shell: bash
        run: python3 ci/bdd-coverage.py bdd-ran
