[package]
name = "codetags-mount-nfs"
description = "macOS live-mount backend: in-process NFSv3 loopback server (PLAN.md §2.6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The server builds and is tested on every OS (it is plain TCP); only mounting
# it is macOS-specific.
[dependencies]
nfs3_server.workspace = true
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "macros"] }
getrandom.workspace = true

[dev-dependencies]
nfs3_client = { workspace = true, features = ["tokio"] }

[lints]
workspace = true
