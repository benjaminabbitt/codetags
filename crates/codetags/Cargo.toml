[package]
name = "codetags"
description = "codetags CLI and codetagsd."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
codetags-mount-fuse.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
codetags-mount-nfs.workspace = true

[dev-dependencies]
codetags-bdd.workspace = true
futures.workspace = true

# The BDD runner: `just bdd`. test = false keeps it out of plain `cargo test`
# (which `just test` runs), so the features run exactly once in `just check`.
[[test]]
name = "bdd"
harness = false
test = false

[lints]
workspace = true
