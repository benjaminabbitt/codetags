[package]
name = "codetags-lsp"
description = "LSP shim for codetags: shares language servers through upstream lspmux (M3), plus the stage-0 session recorder and analyzer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No DuckDB, here or in any dependency: editors start this binary outside
# cargo, where a DuckDB-linked binary does not find its library (PLAN.md §4).
[dependencies]
clap.workspace = true
directories.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
# Re-raises the server's terminating signal, so the editor sees it, and
# reads this user's uid for the socket directory's owner check (MIT).
nix = { workspace = true, features = ["signal", "user"] }

[target.'cfg(windows)'.dependencies]
# CreateProcessW without handle inheritance, for the detached lspmux daemon
# (codetags_lsp::daemon). MIT OR Apache-2.0.
windows = { workspace = true, features = ["Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
