[package]
name = "codetags-lsp"
description = "LSP shim for codetags: the stage-0 session recorder and analyzer (M3), and later the lspmux shim (P3.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No DuckDB, here or in any dependency: editors start this binary outside
# cargo, where a DuckDB-linked binary does not find its library (PLAN.md §4).
[dependencies]
clap.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# Re-raises the server's terminating signal, so the editor sees it (MIT).
nix = { workspace = true, features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
