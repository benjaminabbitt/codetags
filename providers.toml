# Pinned SCIP providers (PLAN.md §4). `just setup-providers` installs them,
# and `just test-providers` runs features/index/ against tests/fixtures/.
# After any provider or SCIP-binding upgrade, compare edge counts per file
# (brief §4.4).

[rust-analyzer]
# The rust-analyzer rustup component of the pinned toolchain. It must stay
# equal to `channel` in rust-toolchain.toml (a unit test in codetags-ingest
# checks this). 1.96.1's rust-analyzer is from 2026-06-26, after enclosing
# ranges landed on 2025-11-28 (rust-lang/rust-analyzer#21141; V62).
install = "rustup-component"
toolchain = "1.96"

[go]
# The Go toolchain scip-go and gocallgraph build with and load packages
# through. CI installs it with actions/setup-go; `just setup-providers`
# checks that `go version` reports this minor version. Its minor must equal
# the `go` line of tools/gocallgraph/go.mod (a unit test in codetags-ingest
# checks this; x/tools v0.50.0 needs Go 1.26).
version = "1.26.8"

[scip-go]
# `go install <module>/cmd/scip-go@<version>`. The module moved from
# github.com/sourcegraph/scip-go to github.com/scip-code/scip-go, and v0.2.7
# declares the new path, so the old one no longer installs (V76).
install = "go-install"
module = "github.com/scip-code/scip-go"
version = "v0.2.7"

[gocallgraph]
# tools/gocallgraph, built from its own go.mod and go.sum with
# `go install -C tools/gocallgraph .`. x-tools is the golang.org/x/tools
# version that go.mod requires (BSD-3-Clause; nothing is linked into Rust).
install = "go-install-local"
path = "tools/gocallgraph"
x-tools = "v0.50.0"

[node]
# Node.js for the npm providers below; CI's actions/setup-node installs this
# exact version (the `providers` job reads it from here). Jelly 0.13.0 needs
# Node 22 or later (V83). Locally, any Node 22 whose global npm prefix is
# per-user (nvm, or `npm config set prefix ~/.local`) will do.
version = "22.22.2"

[scip-typescript]
# Apache-2.0; bundles TypeScript 5.9.3 (V81). `npm install -g` of this spec.
# The runner raises --max-file-byte-size from the 1 MB default and fails on
# any file still skipped (brief §4.4).
npm = "@sourcegraph/scip-typescript@0.4.0"

[jelly]
# github.com/cs-au-dk/jelly, BSD-3-Clause (V83). `npm install -g` of this
# spec. Its JSON call graph (-j) is unioned with scip-typescript's index.
npm = "@cs-au-dk/jelly@0.13.0"

[python]
# The interpreter scip-python runs (it needs `python3` or `python`, and `pip3`
# or `pip`, on PATH) and the provider's name-site script runs. CI installs
# this version with actions/setup-python. scip-python 0.6.6 bundles Pyright
# 1.1.301 and its typeshed, and writes the same index for the fixture under
# Python 3.11, 3.12 and 3.13 (V91), so `just setup-providers` checks only
# that an interpreter and pip are present.
version = "3.12"

[scip-python]
# MIT; bundles Pyright 1.1.301. 0.6.6 (2025-09-05) is the newest release
# (V91). `npm install -g` of this spec.
npm = "@sourcegraph/scip-python@0.6.6"
