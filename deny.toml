# cargo-deny policy: PLAN.md §0.12 (licence boundaries) and D9.
# Run via `just license-check`, which is part of `just check`.

[graph]
# Check every optional backend too (e.g. the WinFsp feature on Windows).
all-features = true

[licenses]
confidence-threshold = 0.93
# The allow list anticipates common permissive licences; unused entries are fine.
unused-allowed-license = "allow"
# Permissive licences only. GPL, AGPL, LGPL, and EUPL are refused here; the
# scoped exceptions below are the only way in, and each needs human approval.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BlueOak-1.0.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# Scoped exceptions (D9), added when the crate lands:
# - winfsp, winfsp-sys: GPL-3.0, only beneath codetags-mount-winfsp (P5.3/S3).
# - lspx: EUPL-1.2, its own crate only (P3.0).
exceptions = []

[licenses.private]
# Workspace crates are unpublished; check their licences anyway.
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
