# cargo-deny policy: PLAN.md §0.12 (licence boundaries) and D9.
# Run via `just license-check`, which is part of `just check`.

[graph]
# Check every optional backend too (e.g. the WinFsp feature on Windows).
all-features = true

[licenses]
confidence-threshold = 0.93
# The allow list anticipates common permissive licences; unused entries are fine.
unused-allowed-license = "allow"
# Permissive licences only. GPL, AGPL, LGPL, and EUPL are refused here; the
# scoped exceptions below are the only way in, and each needs human approval.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BlueOak-1.0.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots (CA root data) via ureq, a build-time dependency of libduckdb-sys.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# Scoped exceptions (D9), each added when its crate lands:
# - winfsp, winfsp-sys: GPL-3.0, for the Windows WinFsp backend (D9, V28;
#   P0b S3). [bans] below keeps them beneath codetags-mount-winfsp. Windows
#   binaries built with that backend are distributed under GPL-3.0.
# - lspx: EUPL-1.2, its own crate only (P3.0); not yet added.
exceptions = [
    # The Unlicense (permissive, OSI-approved public-domain dedication), scoped
    # to the nfs3 crates under codetags-mount-nfs (P0b S2, V42). Pending the
    # human's approval (PLAN.md §0.12); the alternative, nfsserve, needs none.
    { crate = "nfs3_types", allow = ["Unlicense"] },
    { crate = "nfs3_macros", allow = ["Unlicense"] },
    { crate = "winfsp", allow = ["GPL-3.0"] },
    { crate = "winfsp-sys", allow = ["GPL-3.0"] },
]

[licenses.private]
# Workspace crates are unpublished; check their licences anyway.
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# GPL-3.0 stays beneath codetags-mount-winfsp (D9, PLAN.md §0.12): only it may
# depend on winfsp directly, and only winfsp (or it) on winfsp-sys.
deny = [
    { crate = "winfsp", wrappers = ["codetags-mount-winfsp"] },
    { crate = "winfsp-sys", wrappers = ["codetags-mount-winfsp", "winfsp"] },
]
